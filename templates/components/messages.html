{% if messages %}
<div aria-live="polite" aria-atomic="true">
  {% for message in messages %}
  <div class="alert {% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}alert-danger{% elif message.level == DEFAULT_MESSAGE_LEVELS.SUCCESS %}alert-success{% elif message.level == DEFAULT_MESSAGE_LEVELS.WARNING %}alert-warning{% else %}alert-info{% endif %}" role="status">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}
