{% load caretrace_ui %}
<div class="profile-switch" aria-label="Current profile">
  <span class="avatar">{{ profile.initials }}</span>
  <div><strong class="small">{{ request.user.get_full_name|default:request.user.username }}</strong><div class="muted profile-id">My profile · {{ profile.caretrace_id }}</div></div>
  {% icon "ChevronsUpDown" %}
</div>
