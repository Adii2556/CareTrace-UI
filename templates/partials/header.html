<header class="border-bottom">
  <nav class="container py-3 d-flex flex-wrap align-items-center justify-content-between gap-3" aria-label="Main navigation">
    <a class="text-decoration-none fw-semibold text-body" href="{% url 'core:home' %}">CareTrace</a>
    <div class="d-flex flex-wrap align-items-center gap-3">
      {% if user.is_authenticated %}
      <a href="{% url 'core:app' %}"{% if request.resolver_match.view_name == 'core:app' %} aria-current="page"{% endif %}>App</a>
      <a href="{% url 'accounts:profile' %}"{% if request.resolver_match.view_name == 'accounts:profile' %} aria-current="page"{% endif %}>Account</a>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-secondary btn-sm">Log out</button>
      </form>
      {% else %}
      <a href="{% url 'core:home' %}">Home</a>
      <a href="{% url 'accounts:login' %}">Log in</a>
      <a class="btn btn-primary btn-sm" href="{% url 'accounts:register' %}">Register</a>
      {% endif %}
    </div>
  </nav>
</header>
